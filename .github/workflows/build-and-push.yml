name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_IMAGE: php@sha256:0aeb129a60daff2874c5c70fcd9d88cdf3015b4fb4cc7c3f1a32a21e84631036
  PATCH_SHA256: 5fe57ca6ee96d59b36c6e0ca842843c50884f177bef1e85234cf669b577f5e48
  IMAGE_NAME: php74-alpine
  TAG: 7.4.33-fpm-alpine3.16-cve2026-109618

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify patch checksum
        run: echo "${PATCH_SHA256}  patches/7.4-CVE-2026-109618-109619.patch" | sha256sum -c -

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE=${{ env.BASE_IMAGE }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          IMG=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker buildx imagetools create -t "$IMG" "$IMG-amd64" "$IMG-arm64"

      - name: Check manifest platforms
        run: |
          IMG=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker buildx imagetools inspect "$IMG"
          docker buildx imagetools inspect "$IMG" | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$IMG" | grep -q 'linux/arm64'

  verify:
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify ${{ matrix.arch }} image
        run: |
          IMG=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker pull "$IMG"
          docker run --rm "$IMG" php -r 'echo ini_get("max_multipart_body_parts"), PHP_EOL;' | grep -qx -- '-1'
          docker run --rm "$IMG" php-fpm -t
          docker run --rm "$IMG" php -m | grep -Eqi 'mysqli|pdo_mysql|mbstring|curl|openssl|zlib|sqlite|sodium'

  trivy:
    needs: merge
    runs-on: ubuntu-24.04
    steps:
      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
